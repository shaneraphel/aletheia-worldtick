name: check

on:
  push:
  pull_request:

jobs:
  precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: precision
        run: python worldtick.py --verify-precision
      - name: unit
        run: python -m unittest discover -s tests -v
      - name: shows
        run: |
          python show_tick.py
          python show_story.py
          python campaign.py
          python hidden.py
          python sweep.py
          python horizon.py
          python foresight.py
          python bcisweep.py
          python decide.py
          python fillchoice.py
          python audit.py
          python cost.py
          python robust.py
          python closedloop.py
          python tradeoff.py
          python stats.py
          python grid2d.py
          python plandepth.py
          python selector.py
          python partition.py
          python signfill.py
          python show_policy.py
          python tick_bench.py
      - name: paper
        run: python paper/check_numbers.py
