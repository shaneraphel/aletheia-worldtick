name: check

on:
  push:
  pull_request:

jobs:
  precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Figures need Pillow and a CJK font at the path the figure code reads.
      # Ubuntu has no /Library/Fonts, so a Noto CJK face is placed there.
      - name: figures
        run: |
          python -m pip install --quiet pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          sudo mkdir -p /Library/Fonts
          sudo cp "$(find /usr/share/fonts -iname '*NotoSansCJK-Regular*' | head -1)" "/Library/Fonts/Arial Unicode.ttf"
          python -c "from PIL import ImageFont; ImageFont.truetype('/Library/Fonts/Arial Unicode.ttf', 18); print('font ok')"
      - name: precision
        run: python worldtick.py --verify-precision
      - name: unit
        run: python -m unittest discover -s tests -v
      - name: shows
        run: |
          python show_tick.py
          python show_story.py
          python campaign.py
          python hidden.py
          python sweep.py
          python horizon.py
          python foresight.py
          python bcisweep.py
          python decide.py
          python fillchoice.py
          python audit.py
          python cost.py
          python robust.py
          python closedloop.py
          python tradeoff.py
          python stats.py
          python grid2d.py
          python plandepth.py
          python selector.py
          python partition.py
          python signfill.py
          python decisive.py
          python askdepth.py
          python session.py
          python fleet.py
          python pace.py
          python room.py
          python attempt.py
          python ledger.py
          python company.py
          python framecheck.py
          python clock.py
          python near.py
          python reel.py
          python aperture.py
          python late.py
          python tenant.py
          python stale.py
          python luck.py
          python catchup.py
          python rate.py
          python duo.py
          python dose.py
          python worst.py
          python replay.py
          python trio.py
          python system.py
          python scene.py
          python show_policy.py
          python tick_bench.py
      # gpurun.py stays out: it needs macOS with Swift and Metal.
      # Its pinned Mac artifact results/GPU.json is verified by the paper step.
      - name: paper
        run: python paper/check_numbers.py
